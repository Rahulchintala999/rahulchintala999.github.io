<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#f1f3f6;
}

/* Header */
.header {
  background:#2874f0;
  color:#fff;
  padding:10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo {
  font-size:20px;
  font-weight:bold;
}

.search {
  width:50%;
  padding:8px;
  border:none;
  border-radius:4px;
}

/* Banner */
.banner {
  background:#fff;
  padding:10px;
  text-align:center;
  font-weight:bold;
}

/* Products */
.container {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
  padding:15px;
}

.card {
  background:#fff;
  border-radius:8px;
  padding:10px;
  text-align:center;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.card img {
  width:100%;
  height:150px;
  object-fit:cover;
  border-radius:5px;
}

.title {
  font-size:14px;
  margin:8px 0;
}

.price {
  color:green;
  font-weight:bold;
}

button {
  margin-top:8px;
  background:#fb641b;
  color:#fff;
  border:none;
  padding:8px;
  border-radius:4px;
  cursor:pointer;
}

button:hover {
  background:#d95300;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">MyShop</div>
  <input class="search" placeholder="Search for products...">
</div>

<div class="banner">🔥 Best Deals Today 🔥</div>

<div class="container">

  <!-- PRODUCT 1 -->
  <div class="card">
    <img src="mich.123.jpeg">
    <div class="title">My Product</div>
    <div class="price">₹499</div>
    <button onclick="buyNow('https://yourproductlink.com')">Buy Now</button>
  </div>

  <!-- PRODUCT 2 -->
  <div class="card">
    <img src="mich.123.jpeg">
    <div class="title">Another Product</div>
    <div class="price">₹799</div>
    <button onclick="buyNow('https://yourproductlink.com')">Buy Now</button>
  </div>

</div>

<script>
function buyNow(link){
  window.open(link, "_blank");
}
</script>

</body>
</html>
