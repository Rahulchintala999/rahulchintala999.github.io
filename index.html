<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Product Showcase</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f5f5f5;
}

header {
  background: #232f3e;
  color: white;
  padding: 15px;
  text-align: center;
  font-size: 20px;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 15px;
  padding: 15px;
}

/* CARD */
.card {
  background: white;
  padding: 12px;
  border-radius: 10px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

/* IMAGE SLIDER */
.slider {
  display: flex;
  overflow-x: auto;
  gap: 10px;
  scroll-snap-type: x mandatory;
}

.slider img {
  width: 100%;
  aspect-ratio: 4/5; /* 1080:1350 ratio */
  object-fit: cover;
  border-radius: 8px;
  flex: 0 0 100%;
  scroll-snap-align: start;
}

/* Hide scrollbar (mobile look) */
.slider::-webkit-scrollbar {
  display: none;
}

.price {
  color: green;
  font-weight: bold;
  margin: 10px 0;
}

.features {
  font-size: 14px;
  margin: 10px 0;
}

button {
  background: #ff9900;
  border: none;
  padding: 10px;
  cursor: pointer;
  width: 100%;
  border-radius: 5px;
  font-weight: bold;
}

button:hover {
  background: #e68a00;
}
</style>
</head>

<body>

<header>Best Deals For You</header>

<div class="products" id="productList"></div>

<script>
const products = [
  {
    name: "T-Shirt",
    price: "₹500",
    images: [
      "mich.123.jpeg",
      "mich2.jpeg",
      "mich3.jpeg"
    ],
    features: ["100% Cotton", "Comfort Fit", "Best Quality"],
    link: "https://your-affiliate-link.com"
  },
  {
    name: "Shoes",
    price: "₹1500",
    images: [
      "https://via.placeholder.com/400x500",
      "https://via.placeholder.com/400x500"
    ],
    features: ["Running Shoes", "Lightweight", "Durable"],
    link: "https://your-affiliate-link.com"
  }
];

function displayProducts() {
  const list = document.getElementById("productList");
  list.innerHTML = "";

  products.forEach(p => {
    list.innerHTML += `
      <div class="card">

        <div class="slider">
          ${p.images.map(img => `<img src="${img}">`).join("")}
        </div>

        <h3>${p.name}</h3>
        <p class="price">${p.price}</p>

        <ul class="features">
          ${p.features.map(f => `<li>${f}</li>`).join("")}
        </ul>

        <button onclick="buyNow('${p.link}')">
          Get This Product
        </button>

      </div>
    `;
  });
}

function buyNow(link) {
  window.open(link, "_blank");
}

displayProducts();
</script>

</body>
</html>
