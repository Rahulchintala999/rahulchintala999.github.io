<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Product Store</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f5f5f5;
}

.header {
  text-align: center;
  padding: 15px;
  font-size: 22px;
  font-weight: bold;
  background: black;
  color: white;
}

.container {
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding: 10px;
}

.card {
  background: white;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.image-slider {
  display: flex;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
}

.image-slider img {
  width: 100%;
  height: auto;
  aspect-ratio: 4/5; /* 1080:1350 ratio */
  object-fit: cover;
  scroll-snap-align: center;
}

.content {
  padding: 10px;
}

.title {
  font-size: 18px;
  font-weight: bold;
}

.desc {
  font-size: 14px;
  color: gray;
  margin: 5px 0;
}

.price {
  color: green;
  font-weight: bold;
}

.button {
  display: block;
  margin-top: 10px;
  padding: 10px;
  text-align: center;
  background: orange;
  color: white;
  text-decoration: none;
  border-radius: 5px;
}
</style>

</head>
<body>

<div class="header">My Store</div>

<div class="container">

<!-- PRODUCT 1 -->
<div class="card">
  <div class="image-slider">
    <img src="image1.jpg">
    <img src="image2.jpg">
  </div>

  <div class="content">
    <div class="title">Wireless Earbuds</div>
    <div class="desc">Best sound quality, long battery</div>
    <div class="price">₹999</div>
    <a class="button" href="https://amazon.in" target="_blank">Buy Now</a>
  </div>
</div>

<!-- PRODUCT 2 -->
<div class="card">
  <div class="image-slider">
    <img src="image3.jpg">
    <img src="image4.jpg">
  </div>

  <div class="content">
    <div class="title">Smart Watch</div>
    <div class="desc">Fitness tracking, call feature</div>
    <div class="price">₹1499</div>
    <a class="button" href="https://amazon.in" target="_blank">Buy Now</a>
  </div>
</div>

</div>

</body>
</html>
