<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Product Showcase</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f5f5f5;
}

header {
  background: #232f3e;
  color: white;
  padding: 15px;
  text-align: center;
  font-size: 24px;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  padding: 20px;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

.card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  border-radius: 8px;
}

.price {
  color: green;
  font-weight: bold;
  margin: 10px 0;
}

.features {
  font-size: 14px;
  margin: 10px 0;
}

button {
  background: #ff9900;
  border: none;
  padding: 10px;
  cursor: pointer;
  width: 100%;
  border-radius: 5px;
  font-weight: bold;
}

button:hover {
  background: #e68a00;
}
</style>
</head>

<body>

<header>Best Deals For You</header>

<div class="products" id="productList"></div>

<script>
const products = [
  {
    name: "T-Shirt",
    price: "₹500",
    img: "mich.123.jpeg",
    features: ["100% Cotton", "Comfort Fit", "Best Quality"],
    link: "https://your-affiliate-link.com"
  },
  {
    name: "Shoes",
    price: "₹1500",
    img: "https://via.placeholder.com/200",
    features: ["Running Shoes", "Lightweight", "Durable"],
    link: "https://your-affiliate-link.com"
  }
];

function displayProducts() {
  const list = document.getElementById("productList");
  list.innerHTML = "";

  products.forEach(p => {
    list.innerHTML += `
      <div class="card">
        <img src="${p.img}">
        <h3>${p.name}</h3>
        <p class="price">${p.price}</p>
        
        <ul class="features">
          ${p.features.map(f => `<li>${f}</li>`).join("")}
        </ul>

        <button onclick="buyNow('${p.link}')">
          Get This Product
        </button>
      </div>
    `;
  });
}

function buyNow(link) {
  window.open(link, "_blank");
}

displayProducts();
</script>

</body>
</html>
