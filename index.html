<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {margin:0;font-family:Arial;background:#f1f3f6;}

.header {
  background:#2874f0;color:#fff;
  padding:10px;display:flex;
  justify-content:space-between;
}

.logo {font-size:20px;font-weight:bold;}
.search {width:50%;padding:8px;border:none;border-radius:4px;}

.container {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;padding:15px;
}

.card {
  background:#fff;border-radius:8px;
  padding:10px;text-align:center;
}

.card img {
  width:100%;
  height:150px;
  object-fit:cover;
}

.price {color:green;font-weight:bold;}

button {
  background:#fb641b;color:#fff;
  border:none;padding:8px;
  border-radius:4px;cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">MyShop</div>
  <input class="search" placeholder="Search...">
</div>

<div class="container">

  <div class="card">
    <img src="https://m.media-amazon.com/images/I/61CGHv6kmWL._SX679_.jpg">
    <h4>Wireless Earbuds</h4>
    <div class="price">₹999</div>
    <button onclick="buyNow('https://amzn.to/yourlink')">Buy Now</button>
  </div>

  <div class="card">
    <img src="https://m.media-amazon.com/images/I/71-3HjGNDUL._SX679_.jpg">
    <h4>T-Shirt</h4>
    <div class="price">₹499</div>
    <button onclick="buyNow('https://yourstorelink.com')">Buy Now</button>
  </div>

</div>

<script>
function buyNow(link){
  window.open(link, "_blank");
}
</script>

</body>
</html>
